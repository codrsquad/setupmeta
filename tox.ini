[tox]
# Running tests against min/max only to speed up local iterations (all non-EOL versions tested in GH actions)
envlist = py{310,315}, coverage, docs, style
# Pointing to pypi.org mirror explicitly to avoid using internal mirrors in place at some companies
# This is usually not necessary, but can be useful in some cases (eg: latest setuptools not on internal mirror)
indexserver =
    default = https://pypi.org/simple

[testenv]
setenv = COVERAGE_FILE={toxworkdir}/.coverage.{envname}
usedevelop = True
deps = -rtests/requirements.txt
       py310: pip
       py315: pip
commands = pytest {posargs:-vv --cov=setupmeta --cov-report=xml tests}

[testenv:coverage]
setenv = COVERAGE_FILE={toxworkdir}/.coverage
skip_install = True
deps = coverage
commands = coverage combine
           coverage report -m
           coverage xml
           coverage html

[testenv:docs]
skip_install = True
deps = build[uv]
       check-sdist[uv]
       twine
commands = check-sdist
           python -m build --installer uv --outdir {envtmpdir}/dist
           twine check --strict {envtmpdir}/dist/*

[testenv:style]
skip_install = True
deps = ruff
commands = ruff check
           ruff format --diff

[testenv:reformat]
skip_install = True
deps = ruff
commands = ruff check --fix
           ruff format

[testenv:venv]
envdir = .venv
usedevelop = True
commands = {posargs:python --version}

[testenv:refreshscenarios]
usedevelop = True
commands = python tests/scenarios.py regen

[coverage:run]
patch = subprocess
data_file = .tox/.coverage

[coverage:xml]
output = .tox/test-reports/coverage.xml
[coverage:html]
directory = .tox/test-reports/htmlcov
[pytest]
cache_dir = .tox/pytest_cache
